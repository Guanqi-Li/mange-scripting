<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MANGE</title><style>
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f6f5f2;color:#24252a}button,select,input{font:inherit;border:0;border-radius:10px;padding:12px;background:#e8e7e2;color:inherit}button{cursor:pointer}button:disabled{opacity:.35}h1{letter-spacing:5px;font-size:24px}header{padding:16px 20px;background:#f6f5f2;position:sticky;top:0;z-index:1}form{display:flex;gap:8px}input{width:100%;min-width:0;background:white}nav{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}select{flex:1;min-width:100px}#heading{padding:0 20px;font-size:18px}#content{padding:0 20px 24px;display:flex;gap:16px;flex-wrap:wrap}.card{width:calc(33.33% - 11px);cursor:pointer}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#ddd}.card p{margin:8px 0;font-weight:600}.card small{color:#777}.empty{padding:60px 0;color:#888}.chapters{width:100%;display:flex;flex-direction:column;gap:6px}.chapters button{text-align:left}.selected{background:#d4e4d8;color:#1a5e38;font-weight:bold}#reader{position:fixed;inset:0;background:#090909;color:white}#viewport{height:100%;overflow:auto;overscroll-behavior:contain}#pages{position:relative}.page{position:relative;overflow:hidden;touch-action:pan-y;min-height:60px}.page img{display:block;width:100%;transform-origin:0 0}#top,#bottom{position:absolute;z-index:3;background:#191919;left:0;right:0;display:flex;align-items:center;gap:8px;padding:12px}#top{top:0;padding-top:max(12px,env(safe-area-inset-top))}#bottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom));justify-content:space-around}#reader button{background:#292929;color:#fff}#title{flex:1;font-size:14px}#tail{text-align:center;padding:24px}dialog{width:96%;height:92%;border:0;border-radius:16px;background:#f6f5f2;padding:20px}#chapterlist{height:calc(100% - 65px);overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:14px}#chapterlist button{text-align:left;flex-shrink:0}#notice{color:#b00;padding:0 20px}[hidden]{display:none!important}@media(min-width:700px){.card{width:140px}}

:root{color-scheme:light dark;--bg:#f2f2f7;--ink:#1c1c1e;--surface:rgba(255,255,255,.82);--field:rgba(118,118,128,.12);--line:rgba(60,60,67,.12);--accent:#007aff;--secondary:#6c6c70}
html,body,#home{background:var(--bg);color:var(--ink);min-height:100%}body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{padding:14px 20px 18px;background:var(--bg)}
#home,#content,#heading,#notice,nav,#queryform{background:var(--bg)}
button,select,input{min-height:44px;border-radius:22px;background:var(--field);color:var(--ink);font-size:15px;letter-spacing:-.2px}
button{font-weight:600;-webkit-tap-highlight-color:transparent;transition:opacity .15s,transform .15s}
button:active{opacity:.6;transform:scale(.97)}
input{border-radius:24px;padding:14px 18px;background:var(--field);font-size:17px}
input:focus{outline:2px solid var(--accent);outline-offset:2px}
#queryform button{flex-shrink:0;white-space:nowrap;background:var(--accent);color:white;padding:12px 18px}
nav{gap:8px;margin-top:14px}nav button{font-size:13px;padding:10px 12px;min-height:40px}
#removeSource{color:#ff3b30}#sources{background:var(--surface);border:1px solid var(--line);font-size:14px;padding-right:24px}
#heading{font-size:28px;letter-spacing:-.7px;margin:16px 0 20px;font-weight:750}
.card img{border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08)}.card p{letter-spacing:-.25px;font-size:15px;line-height:1.35}.card small,.empty{color:var(--secondary)}
.chapters{border-radius:20px;overflow:hidden;background:var(--surface);gap:0}.chapters button{border-radius:0;background:transparent;padding:16px;text-align:left;border-bottom:1px solid var(--line)}
.chapters .selected,#chapterlist .selected{background:rgba(0,122,255,.12);color:var(--accent)}
dialog{background:var(--bg);color:var(--ink);border-radius:28px;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0006;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#chapterlist button{background:var(--surface);border-radius:14px;padding:16px}
#top,#bottom{background:rgba(30,30,32,.86);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid #ffffff15}
#reader button{border-radius:24px;min-height:44px;background:#ffffff18;color:white}#bottom{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:30px;padding:10px 6px;gap:4px}#bottom button{font-size:14px;padding:10px 12px}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f2f2f7;--surface:rgba(44,44,46,.88);--field:rgba(118,118,128,.25);--line:rgba(84,84,88,.65);--accent:#0a84ff;--secondary:#98989f}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
@media(prefers-reduced-transparency:reduce){#top,#bottom{background:#1c1c1e;backdrop-filter:none;-webkit-backdrop-filter:none}dialog::backdrop{backdrop-filter:none;-webkit-backdrop-filter:none}}

/* Native host is the single authority for navigation and document surfaces. */
html[data-native-theme="light"]{color-scheme:light;--bg:#f2f2f7;--ink:#1c1c1e;--surface:rgba(255,255,255,.82);--field:rgba(118,118,128,.12);--line:rgba(60,60,67,.12);--accent:#007aff;--secondary:#6c6c70}
html[data-native-theme="dark"]{color-scheme:dark;--bg:#000;--ink:#f2f2f7;--surface:rgba(44,44,46,.88);--field:rgba(118,118,128,.25);--line:rgba(84,84,88,.65);--accent:#0a84ff;--secondary:#98989f}
</style></head><body><section id="home"><header><form id="queryform"><input id="query" placeholder="搜索漫画" enterkeyhint="search" aria-label="搜索漫画"><button>搜索</button></form><nav><select id="sources" aria-label="当前源"></select><button id="import">导入源</button><button id="removeSource">删除源</button><button id="shelf">书架</button></nav></header><p id="notice" role="alert"></p><h2 id="heading">书架</h2><main id="content"></main></section><section id="reader" hidden><div id="viewport"><div id="pages"></div><div id="tail"></div></div><div id="top" hidden><button id="back">返回</button><span id="title"></span></div><div id="bottom" hidden><button id="prev">上一章</button><button id="catalog">目录</button><button id="mode">切换模式</button><button id="next">下一章</button></div></section><dialog id="directory"><button id="closeDirectory">关闭目录</button><div id="chapterlist"></div></dialog><script>__APP__</script></body></html>
